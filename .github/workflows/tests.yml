name: Tests

"on":
  pull_request:
  workflow_dispatch:
  # Run before every release build, see build.yml
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same minor version as the Remote's runtime (r2-pyinstaller)
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q
